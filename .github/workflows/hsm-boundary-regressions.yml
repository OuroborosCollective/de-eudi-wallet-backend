name: HSM boundary runtime regressions

on:
  push:
    branches: [patch-1, 'security/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: hsm-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundary-and-softhsm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install digest-pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 --max-time 120 \
            -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip
          echo "473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d  $RUNNER_TEMP/kotlin.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Create disposable software PKCS11 token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends softhsm2
          mkdir "$RUNNER_TEMP/hsm-tokens"
          printf 'directories.tokendir = %s/hsm-tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm2.conf"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf"
          # Disposable test PINs, not deployment credentials.
          softhsm2-util --init-token --free --label hsm-boundary-regression --so-pin 87654321 --pin 12345678
          library="$(dpkg -L libsofthsm2 | grep '/libsofthsm2\.so$' | head -1)"
          test -f "$library"
          echo "SOFTHSM2_CONF=$SOFTHSM2_CONF" >> "$GITHUB_ENV"
          echo "SOFTHSM_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Compile and run boundary, mutation and native adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 security-tests/run_hsm_boundary_tests.py --output "$RUNNER_TEMP/hsm-evidence" --native-library "$SOFTHSM_LIBRARY" --mutations
          dpkg-query -W softhsm2 libsofthsm2 > "$RUNNER_TEMP/hsm-evidence/software-token-version.txt"
      - name: Upload evidence only, never token state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hsm-boundary-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hsm-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable token state
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/hsm-tokens" "$RUNNER_TEMP/softhsm2.conf"
