name: Security hardening invariants

on:
  push:
    branches: [main, patch-1, 'security/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify fail-closed source invariants
        run: python security-tests/security_invariants.py
