name: Security hardening invariants

on:
  push:
    branches: [main, patch-1, 'security/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify fail-closed source invariants
        run: python security-tests/security_invariants.py
      - name: Verify HSM UTC validity oracle
        run: python security-tests/hsm_validity_oracle.py
      - name: Verify MDVM replay and evidence oracle
        run: python security-tests/mdvm_replay_oracle.py
      - name: Emit revision-bound source evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'revision=%s\n' "$GITHUB_SHA"
          sha256sum \
            src/main/kotlin/de/eudiwallet/backend/shared/hsm/HsmKey.kt \
            src/main/kotlin/de/eudiwallet/backend/shared/hsm/HsmSession.kt \
            src/main/kotlin/de/eudiwallet/backend/shared/keyrollover/SymmetricKeyLineage.kt \
            src/main/kotlin/de/eudiwallet/backend/shared/keyrollover/AsymmetricSigningLineage.kt \
            src/main/kotlin/de/eudiwallet/backend/mdvm/MdvmAccount.kt \
            src/main/kotlin/de/eudiwallet/backend/mdvm/MdvmAccountService.kt \
            src/main/kotlin/de/eudiwallet/backend/mdvm/MdvmAccountRepository.kt \
            security-tests/security_invariants.py \
            security-tests/hsm_validity_oracle.py \
            security-tests/mdvm_replay_oracle.py
